<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8faf9">
<title>RJ Bus</title>
<meta name="description" content="RJ Bus: consulte linhas e pontos de ônibus do Rio de Janeiro. Gratuito e sem anúncios.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<div style="max-width:650px;margin:auto">
<header>RJ Bus <span class="tagline">Gratuito e sem anúncios</span></header>
<button id="install">Instalar aplicativo</button>
</div>
<main>
<input id="search" class="search" placeholder="Pesquisar linha ou ponto..." maxlength="120" aria-label="Pesquisar linha ou ponto">
<section class="panel">
<h2 id="heading" tabindex="-1">Próximos</h2>
<div aria-live="polite" id="content" class="empty">Permita o acesso à localização para encontrar pontos próximos.<p>
<button class="small" id="locate">Usar minha localização</button>
</p>
</div>
<div class="status" id="status" role="status">Carregando linhas e pontos…</div>
</section>
<footer><a href="https://github.com/cassioomorenorj/rj-bus" target="_blank" rel="noopener noreferrer">Sobre o projeto</a> · <a href="https://dados.mobilidade.rio/gtfs/schedule" target="_blank" rel="noopener noreferrer">Dados oficiais</a></footer>
</main>
<nav aria-label="Abas">
<button data-tab="proximos" class="active">
<span>⌖</span>Próximos</button>
<button data-tab="linhas">
<span>▤</span>Linhas</button>
<button data-tab="pontos">
<span>⚑</span>Pontos</button>
<button data-tab="favoritos">
<span>☆</span>Favoritos</button>
</nav>
<script src="./app.js?v=3" type="module">
</script>
</body>
</html>
